name: Public source policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Test publication checks
        run: node --test scripts/check-public-files.test.mjs
      - name: Inspect index and public working files
        run: node scripts/check-public-files.mjs --worktree
      - name: Inspect committed history
        run: node scripts/check-public-files.mjs --history HEAD
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Verify SDK imports
        run: npm run check:sdk
      - name: Typecheck and build readiness scaffold
        run: npm run build
